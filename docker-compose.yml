# docker-compose.yml

services:

  # ─── Backend ──────────────────────────────────────────────────────
  # Uses NeonDB (cloud postgres) — no local postgres container needed
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: collexa_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE}
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "5000:5000"
    volumes:
      - ./Backend:/app               # live reload ke liye
      - /app/node_modules            # node_modules override mat karo

  # ─── Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: collexa_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app              # live reload ke liye
      - /app/node_modules            # node_modules override mat karo